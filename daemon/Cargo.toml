[package]
name = "mousex"
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "MouseX: share one keyboard, mouse and clipboard across Windows, macOS and Linux computers."
edition = "2024"

[dependencies]
mousex-core = { path = ".." }
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[target.'cfg(windows)'.dependencies]
mousex-native = { path = "../native" }

[target.'cfg(target_os = "macos")'.dependencies]
mousex-platform-macos = { path = "../platform-macos" }

[target.'cfg(target_os = "linux")'.dependencies]
mousex-platform-linux = { path = "../platform-linux" }
ksni = { version = "0.2", optional = true }

[features]
tray = ["dep:ksni"]

[dev-dependencies]
rand = "0.8"
