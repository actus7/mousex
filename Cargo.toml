[package]
name = "mousex-core"
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "MouseX core: protocol, screen layout, edge routing, keyboard maps, pairing and discovery."
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14", features = ["pem"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
sha2 = "0.11"
thiserror = "2"
rand = "0.8"
x509-parser = "0.18"
mdns-sd = "0.13"
sys-locale = "0.3"

[workspace.package]
version = "1.0.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/actus7/mousex"
authors = ["Alex Schmitt"]
rust-version = "1.88"

[workspace]
members = [".", "native", "daemon", "platform-macos"]
resolver = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
