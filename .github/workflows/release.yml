# Release pipeline: builds the Windows and macOS packages and publishes them on a `v*` tag.
# workflow_dispatch builds the packages as artifacts without publishing anything.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-windows-gnu

      - name: Build mousex and mousex-agent
        shell: bash
        run: cargo build --release --locked -p mousex --target x86_64-pc-windows-gnu

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build editor frontend
        shell: bash
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build

      - name: Build editor (Tauri)
        shell: bash
        working-directory: app/src-tauri
        run: cargo build --release --locked --features tauri/custom-protocol --target x86_64-pc-windows-gnu

      - name: Stage and zip Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-gnu'
          $release = Join-Path 'target' (Join-Path $target 'release')
          $editorRelease = Join-Path 'app/src-tauri/target' (Join-Path $target 'release')
          $stage = Join-Path $env:RUNNER_TEMP 'MouseX-windows-x64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item -LiteralPath (Join-Path $release 'mousex.exe') -Destination $stage
          Copy-Item -LiteralPath (Join-Path $release 'mousex-agent.exe') -Destination $stage
          Copy-Item -LiteralPath (Join-Path $editorRelease 'mousex-app.exe') -Destination (Join-Path $stage 'mousex-editor.exe')

          # Gnu builds load WebView2 through this DLL; it lands in the target-triple release dir.
          $loader = Get-ChildItem -LiteralPath 'app/src-tauri/target' -Recurse -Filter 'WebView2Loader.dll' -File |
              Where-Object { $_.Directory.FullName -like "*\$target\release" } |
              Select-Object -First 1
          if (-not $loader) { throw 'WebView2Loader.dll not found in the editor release directory.' }
          Copy-Item -LiteralPath $loader.FullName -Destination $stage

          foreach ($doc in 'LICENSE-MIT', 'LICENSE-APACHE', 'README.md') {
              Copy-Item -LiteralPath $doc -Destination $stage
          }

          $zip = Join-Path $PWD.Path 'MouseX-windows-x64.zip'
          Remove-Item -LiteralPath $zip -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          Get-ChildItem -LiteralPath $stage | ForEach-Object { Write-Host $_.Name }

      - uses: actions/upload-artifact@v4
        with:
          name: MouseX-windows-x64
          path: MouseX-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS universal package
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build both architectures
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p mousex --target "$target"
          done

      - name: Create universal binaries and archive
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/MouseX-macos-universal"
          mkdir -p "$stage"
          for bin in mousex mousex-agent; do
            lipo -create -output "$stage/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            chmod 755 "$stage/$bin"
            # Ad-hoc signature for the release; install.sh re-signs with the local identity.
            codesign --force -s - --identifier "com.mousex.$bin" "$stage/$bin"
          done
          cp LICENSE-MIT LICENSE-APACHE README.md "$stage/"
          tar -czf MouseX-macos-universal.tar.gz -C "$stage" \
            mousex mousex-agent LICENSE-MIT LICENSE-APACHE README.md
          tar -tzf MouseX-macos-universal.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: MouseX-macos-universal
          path: MouseX-macos-universal.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    # Never publish from workflow_dispatch: its ref is a branch, not a version tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    # The signing key lives only in this environment: it needs the maintainer's approval per run and
    # accepts only v* tags, so a workflow change merged by mistake cannot reach the key on its own.
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cp install/install.ps1 install/install.sh dist/
          cd dist
          sha256sum MouseX-windows-x64.zip MouseX-macos-universal.tar.gz install.ps1 install.sh > SHA256SUMS
          cat SHA256SUMS

      # Auto-update installs only what this key signed. The tag is part of the signed text, so an
      # old release cannot be replayed as a new one. Public key: src/update.rs (RELEASE_PUBLIC_KEY).
      - name: Sign checksums
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.MOUSEX_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::secret MOUSEX_RELEASE_SIGNING_KEY is missing; refusing to publish an unsigned release"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$key"
          { printf 'MouseX %s\n' "$GITHUB_REF_NAME"; cat dist/SHA256SUMS; } > "$RUNNER_TEMP/signed.txt"
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$RUNNER_TEMP/signed.txt" -out dist/SHA256SUMS.sig
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release-key.pub"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release-key.pub" -rawin \
            -in "$RUNNER_TEMP/signed.txt" -sigfile dist/SHA256SUMS.sig
          rm -f "$key"

      - name: Release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          header="## [${version}]"
          : > release-notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v header="$header" '
              index($0, header) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s release-notes.md ]; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "MouseX $GITHUB_REF_NAME" \
            "${notes[@]}" \
            dist/MouseX-windows-x64.zip \
            dist/MouseX-macos-universal.tar.gz \
            dist/install.ps1 \
            dist/install.sh \
            dist/SHA256SUMS \
            dist/SHA256SUMS.sig
