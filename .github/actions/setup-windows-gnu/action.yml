# Shared setup for every Windows job: MinGW-w64 (gcc for `ring`, windres for daemon/build.rs)
# plus the Rust GNU target. MouseX Windows builds use x86_64-pc-windows-gnu only.
name: Setup Windows GNU toolchain
description: MSYS2 MinGW-w64 toolchain, Rust x86_64-pc-windows-gnu target and cargo cache.

runs:
  using: composite
  steps:
    - name: Install MSYS2 MinGW-w64 toolchain
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        location: C:\msys64
        update: false
        install: mingw-w64-x86_64-toolchain

    # gcc and windres live in mingw64/bin; add it to PATH for all later steps.
    - name: Put MinGW tools on PATH
      shell: pwsh
      run: |
        Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\mingw64\bin'

    # GNU as the *host* toolchain, not just a target: build scripts (embed-resource in the
    # editor) pick the resource compiler by host, and an MSVC host emits a .lib MinGW ld rejects.
    - name: Install Rust (GNU host)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable-x86_64-pc-windows-gnu
        components: clippy, rustfmt

    # Two workspaces: the root (mousex, native, daemon, ...) and the Tauri editor.
    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          .
          app/src-tauri
