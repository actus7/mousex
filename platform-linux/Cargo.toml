[package]
name = "mousex-platform-linux"
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "MouseX Linux backend: XTest or RemoteDesktop portal (libei) injection, RandR displays, clipboard and dialogs."
edition = "2024"

[target.'cfg(target_os = "linux")'.dependencies]
# Mesma versão do x11rb que o arboard usa: uma cópia só no binário.
x11rb = { version = "0.13", features = ["xtest", "randr", "xfixes"] }
arboard = "3.7"
image = { version = "0.25", default-features = false, features = ["png"] }
# "screencast": o remote_desktop do ashpd 0.13 não compila sem ele.
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "input_capture"] }
reis = { version = "0.7", features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false }
# CLOCK_MONOTONIC para os frames do libei (mesma versão que o reis já usa).
rustix = { version = "1", default-features = false, features = ["std", "time"] }
